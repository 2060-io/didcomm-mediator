# Base domain used for ingress host and public identifiers
global:
  domain: dev.example.io  

app:
  name: didcomm-mediator

ingress:
  enabled: true
  name: didcomm-mediator-ingress
  host: ca.{{ .Values.global.domain }}
  tlsSecret: ca.{{ .Values.global.domain }}-cert

service:
  name: didcomm-mediator-service
  ports:
    http: 80

# StatefulSet configuration (used instead of Deployment)
statefulset:
  name: didcomm-mediator
  serviceName: didcomm-mediator-service-service
  replicas: 2
  containerName: didcomm-mediator-service-container
  image:
    pullPolicy: Always
  storage: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  env:
    AGENT_LOG_LEVEL: "0"
    AGENT_ENDPOINTS: "wss://ca.{{ .Values.global.domain }},https://ca.{{ .Values.global.domain }}"
    AGENT_NAME: "2060 Cloud Agent - dev"
    WALLET_NAME: "2060-cloud-agent-dev"
    WALLET_KEY: "2060-cloud-agent-dev"
    POSTGRES_HOST: "postgres-service-core-dev"
    POSTGRES_USER: "cloud-agent"
    POSTGRES_PASSWORD: "cloud-agent"
    AGENT_PUBLIC_DID: "did:web:ca.{{ .Values.global.domain }}"
    KEY_DERIVATION_METHOD: "ARGON2I_MOD"
    FIREBASE_CFG_FILE: /config/firebase-cfg.json
    DIDCOMM_V1_SUPPORT: "true"
    DIDCOMM_V2_SUPPORT: "true"
  # To reference values from existing Kubernetes secrets:
  # envFromSecrets:
  #   - name: POSTGRES_PASSWORD
  #     secretName: my-existing-secret
  #     key: password
  envFromSecrets: []

# Admin API configuration. The admin HTTP server runs on a separate
# container port so it can be exposed (or not) through its own Service /
# Ingress, independently of the public DIDComm endpoint.
admin:
  # Set to false to disable the admin port entirely. When true, ADMIN_API_KEY
  # must resolve to a non-empty value — the mediator refuses to start otherwise.
  enabled: true
  port: 4001
  # Either provide the key inline (apiKey) or reference an existing Secret that
  # holds it under the given `secretKey`. `existingSecret` wins if both are set.
  apiKey: ""
  existingSecret: ""
  secretKey: ADMIN_API_KEY
  # If set, enables CORS on the admin app with this origin.
  corsOrigin: ""
  # Internal Service for the admin port. By default it is ClusterIP with no
  # Ingress — operators should expose it only via a dedicated internal ingress
  # or via kubectl port-forward. To publish it externally, add annotations /
  # change the Service type here.
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  cleanup:
    # When true, a cron job inside the admin app deletes connections whose
    # updatedAt is older than `inactiveDays`, along with their queued messages.
    enabled: false
    inactiveDays: 365
    # Node-cron expression (not Kubernetes CronJob syntax).
    cron: "0 3 * * *"
